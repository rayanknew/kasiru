[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kasiru"
version = "0.1.0"
description = "Privacy-first gateway for LLM APIs: data classes, reversible pseudonymisation, tiered routing with a local last resort"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
keywords = ["llm", "gateway", "privacy", "pii", "pseudonymisation", "openai-compatible", "local-first", "russian", "ukrainian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = []

[project.optional-dependencies]
ids = ["phonenumbers>=8.13", "python-stdnum>=1.19", "mnemonic>=0.20"]
ru = ["natasha>=1.6", "razdel>=0.5", "pymorphy2>=0.9.1", "pymorphy2-dicts-ru", "setuptools<81"]
uk = ["spacy>=3.7,<3.9", "pymorphy2-dicts-uk"]
all = ["kasiru[ids,ru,uk]"]

[project.scripts]
kasiru = "kasiru.cli:main"

[project.urls]
Homepage = "https://github.com/rayanknew/kasiru"
Issues = "https://github.com/rayanknew/kasiru/issues"

[tool.setuptools.packages.find]
include = ["kasiru*"]
